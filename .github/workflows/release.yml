---
name: Publish to PyPI and TestPyPI
"on":
  push:
    branches:
      - master
jobs:
  build-n-publish:
    name: Publish to PyPI and TestPyPI
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: read
      # For Trusted Publishing and release attestations.
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Build Wheel
        run: uv build
      - name: Generate PyPI attestations
        # v0.0.7
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --verbose
